definitions:
  api.SwaggerAccount:
    properties:
      balance:
        type: integer
      created_at:
        type: string
      currency:
        type: string
      id:
        type: integer
      owner:
        type: string
    type: object
  api.SwaggerEntry:
    properties:
      account_id:
        type: integer
      amount:
        description: can be negative or positive
        type: integer
      created_at:
        type: string
      id:
        type: integer
    type: object
  api.SwaggerTransfer:
    properties:
      amount:
        description: must be positive
        type: integer
      created_at:
        type: string
      from_account_id:
        type: integer
      id:
        type: integer
      to_account_id:
        type: integer
    type: object
  api.SwaggerTransferResult:
    properties:
      from_account:
        $ref: '#/definitions/api.SwaggerAccount'
      from_entry:
        $ref: '#/definitions/api.SwaggerEntry'
      to_account:
        $ref: '#/definitions/api.SwaggerAccount'
      to_entry:
        $ref: '#/definitions/api.SwaggerEntry'
      transfer:
        $ref: '#/definitions/api.SwaggerTransfer'
    type: object
  api.loginUserResponse:
    properties:
      access_token:
        type: string
      access_token_expires_at:
        type: string
      refresh_token:
        type: string
      refresh_token_expires_at:
        type: string
      session_id:
        type: string
      user:
        $ref: '#/definitions/api.userResponse'
    type: object
  api.userResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      password_changed_at:
        type: string
      username:
        type: string
    type: object
info:
  contact: {}
paths:
  /accounts:
    get:
      parameters:
      - description: Account Currency
        in: body
        name: currency
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              items:
                $ref: '#/definitions/api.SwaggerAccount'
              type: array
            type: array
      security:
      - ApiKeyAuth: []
      summary: lists all accounts for a specific User ID
    post:
      parameters:
      - description: Account Currency
        in: body
        name: currency
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SwaggerAccount'
      security:
      - ApiKeyAuth: []
      summary: creates a new account with a given currency
  /accounts/:id:
    get:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SwaggerAccount'
      security:
      - ApiKeyAuth: []
      summary: gets an existing account for a specified User ID
  /transfers:
    post:
      parameters:
      - description: Account Currency
        in: body
        name: currency
        required: true
        schema:
          type: string
      - description: Amount of Money
        in: body
        name: amount
        required: true
        schema:
          type: integer
      - description: From Account ID
        in: body
        name: from_account_id
        required: true
        schema:
          type: integer
      - description: To Account ID
        in: body
        name: to_account_id
        required: true
        schema:
          type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SwaggerTransferResult'
      security:
      - ApiKeyAuth: []
      summary: transfer money between accounts with same currency
  /user:
    post:
      parameters:
      - description: Username
        in: body
        name: username
        required: true
        schema:
          type: string
      - description: Email Address
        in: body
        name: email
        required: true
        schema:
          type: string
      - description: Full Name
        in: body
        name: fullname
        required: true
        schema:
          type: string
      - description: Password
        in: body
        name: password
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.userResponse'
      summary: creates a new user
  /user/login:
    post:
      parameters:
      - description: Username
        in: body
        name: username
        required: true
        schema:
          type: string
      - description: Password
        in: body
        name: password
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.loginUserResponse'
      summary: log in an existing user
  /user/logout:
    post:
      responses: {}
      summary: logs out an existing user
securityDefinitions:
  ApiAuthKey:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
